<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Descarga las fotos de un carrusel público de TikTok por separado o juntas en un ZIP.">
  <meta name="theme-color" content="#090909">
  <title>Frametok · Fotos de TikTok</title>
  <link rel="icon" href="./assets/frametok.png" type="image/png">
  <link rel="stylesheet" href="./styles.css?v=7">
  <script defer src="./vendor/jszip.min.js"></script>
  <script defer src="./app.js?v=3"></script>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <div class="stage">
      <header class="masthead">
        <a class="brand" href="./" aria-label="Frametok, inicio">
          <span class="brand-mark" aria-hidden="true">f</span>
          <span>Frametok</span>
        </a>
        <a class="repository" href="https://github.com/CodeByDante/Frametok" target="_blank" rel="noreferrer">GitHub</a>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Fotos de TikTok.</h1>
        <p class="intro-copy" id="link-help">Guarda las fotos de un carrusel público por separado o en ZIP.</p>
        <form id="link-form">
          <label class="visually-hidden" for="post-link">Enlace del carrusel</label>
          <input id="post-link" name="url" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://www.tiktok.com/@usuario/photo/…" aria-describedby="form-status link-help" required>
          <div class="form-actions">
            <button type="submit" class="button button-primary" id="load-photos"><span>Descargar</span></button>
            <button type="button" class="button" id="paste-link">Pegar enlace</button>
          </div>
          <p class="status" id="form-status" role="status" hidden></p>
        </form>
      </section>
    </div>

    <section class="results" id="results" aria-labelledby="gallery-title" hidden>
      <div class="results-heading">
        <div>
          <div class="results-title">
            <h2 id="gallery-title">Fotos del carrusel</h2>
            <span class="photo-count" id="photo-count" role="status"></span>
          </div>
          <a class="publication" id="publication" target="_blank" rel="noreferrer"></a>
        </div>
        <div class="download-actions">
          <button type="button" class="button" id="download-audio" hidden>Descargar audio</button>
          <button type="button" class="button button-zip" id="download-zip">Descargar fotos en ZIP</button>
        </div>
      </div>
      <audio id="audio-player" class="audio-player" aria-label="Reproductor del audio del carrusel" controls controlslist="nodownload" crossorigin="anonymous" preload="none" hidden></audio>
      <p class="status" id="download-status" role="status" hidden></p>
      <ul class="gallery" id="photo-gallery" aria-label="Fotos en el orden de la publicación"></ul>
    </section>

  </main>
</body>
</html>
