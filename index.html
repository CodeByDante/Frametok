<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Descarga carruseles públicos de TikTok y guarda videos en MP4 o su audio en MP3.">
  <meta name="theme-color" content="#090909">
  <title>TikTok FlowLoad</title>
  <link rel="icon" href="./assets/frametok.png" type="image/png">
  <link rel="stylesheet" href="./styles.css?v=10">
  <script defer src="./vendor/jszip.min.js"></script>
  <script defer src="./app.js?v=6"></script>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <div class="stage">
      <header class="masthead">
        <a class="brand" href="./" aria-label="Frametok, inicio">
          <span class="brand-mark" aria-hidden="true">f</span>
          <span>Frametok</span>
        </a>
        <a class="repository" href="https://github.com/CodeByDante/Frametok" target="_blank" rel="noreferrer">GitHub</a>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">TikTok FlowLoad</h1>
        <form id="link-form">
          <label class="visually-hidden" for="post-link">Enlace de TikTok</label>
          <input id="post-link" name="url" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://www.tiktok.com/…" aria-describedby="form-status" required>
          <div class="form-actions">
            <button type="submit" class="button button-primary" id="load-photos"><span>Descargar</span></button>
            <button type="button" class="button" id="paste-link">Pegar enlace</button>
          </div>
          <p class="status" id="form-status" role="status" hidden></p>
        </form>
      </section>
    </div>

    <section class="results" id="results" aria-labelledby="gallery-title" hidden>
      <div class="results-heading">
        <div>
          <div class="results-title">
            <h2 id="gallery-title">Fotos del carrusel</h2>
            <span class="photo-count" id="photo-count" role="status"></span>
          </div>
          <a class="publication" id="publication" target="_blank" rel="noreferrer"></a>
        </div>
        <div class="download-actions" id="carousel-actions">
          <button type="button" class="button button-zip" id="download-zip">Descargar fotos en ZIP</button>
        </div>
      </div>
      <div class="carousel-audio" id="carousel-audio" hidden>
        <audio id="audio-player" crossorigin="anonymous" preload="metadata" hidden></audio>
        <div class="audio-controls" role="group" aria-label="Reproductor del audio del carrusel">
          <button type="button" class="button audio-toggle" id="audio-toggle" aria-label="Reproducir audio"></button>
          <div class="audio-timeline">
            <input type="range" class="audio-slider" id="audio-seek" aria-label="Posición del audio" min="0" max="1" step="any" value="0" disabled>
            <div class="audio-time" aria-hidden="true">
              <span id="audio-current">0:00</span>
              <span id="audio-duration">–:––</span>
            </div>
          </div>
          <label class="audio-level">
            <span class="visually-hidden">Volumen del audio</span>
            <input type="range" class="audio-slider audio-volume" id="audio-volume" min="0" max="100" step="5" value="100">
          </label>
        </div>
        <button type="button" class="button" id="download-audio">Descargar audio</button>
        <p class="status" id="audio-status" role="status" hidden></p>
      </div>
      <div class="video-panel" id="video-panel" hidden>
        <video id="video-player" class="video-preview" aria-label="Vista previa del video de TikTok" controls controlslist="nodownload" playsinline crossorigin="anonymous" preload="metadata"></video>
        <div class="download-actions" id="video-actions">
          <button type="button" class="button" id="download-mp3">Descargar MP3</button>
          <button type="button" class="button" id="download-mp4">Descargar MP4</button>
        </div>
      </div>
      <p class="status" id="download-status" role="status" hidden></p>
      <ul class="gallery" id="photo-gallery" aria-label="Fotos en el orden de la publicación"></ul>
    </section>

  </main>
</body>
</html>
